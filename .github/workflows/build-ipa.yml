name: Build Madeira IPA

on:
  push:
    branches: [ main, github-actions-build ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Install dependencies
      run: |
        brew install cmake ninja pkg-config autoconf automake libtool
      continue-on-error: true

    - name: List repository structure
      run: |
        echo "=== Root directory ==="
        ls -la
        echo ""
        echo "=== app directory ==="
        ls -la app/ || echo "app directory not found"
        echo ""
        echo "=== build directory ==="
        ls -la build/ || echo "build directory not found"

    - name: Find Xcode project
      run: |
        find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -20

    - name: Build iOS App with Xcode (app directory)
      run: |
        if [ -d "app" ]; then
          cd app
          xcodebuild \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/DerivedData \
            -destination generic/platform=iOS \
            clean build 2>&1 || echo "Build attempt completed"
        else
          echo "app directory not found"
        fi
      continue-on-error: true

    - name: Generate IPA
      run: |
        if [ -d "app" ]; then
          cd app
          xcodebuild \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/DerivedData \
            -destination generic/platform=iOS \
            -archivePath ../build/Madeira.xcarchive \
            archive 2>&1 || echo "Archive attempt completed"
          
          cd ..
          xcodebuild \
            -exportArchive \
            -archivePath build/Madeira.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa 2>&1 || echo "Export attempt completed"
        fi
      continue-on-error: true

    - name: Check for build artifacts
      run: |
        echo "=== DerivedData ==="
        ls -laR build/DerivedData/ 2>/dev/null || echo "No DerivedData found"
        echo ""
        echo "=== IPA directory ==="
        ls -laR build/ipa/ 2>/dev/null || echo "No IPA directory found"
        echo ""
        echo "=== Archive ==="
        ls -laR build/Madeira.xcarchive/ 2>/dev/null || echo "No archive found"

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Madeira.ipa
        path: build/ipa/Madeira.ipa
        retention-days: 7
      continue-on-error: true

    - name: Upload Archive artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Madeira.xcarchive
        path: build/Madeira.xcarchive
        retention-days: 7
      continue-on-error: true

    - name: Upload DerivedData for debugging
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs
        path: build/DerivedData
        retention-days: 7
      continue-on-error: true
