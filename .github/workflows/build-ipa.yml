name: Build Madeira IPA

on:
  push:
    branches: [ main, github-actions-build ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Install dependencies
      run: |
        brew install cmake ninja pkg-config autoconf automake libtool
      continue-on-error: true

    - name: Build iOS App with Xcode
      run: |
        cd app
        xcodebuild \
          -project Madeira.xcodeproj \
          -scheme Madeira \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath ../build/DerivedData \
          -destination generic/platform=iOS \
          -allowProvisioningUpdates \
          clean build

    - name: Generate IPA
      run: |
        cd app
        xcodebuild \
          -project Madeira.xcodeproj \
          -scheme Madeira \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath ../build/DerivedData \
          -destination generic/platform=iOS \
          -allowProvisioningUpdates \
          -archivePath ../build/Madeira.xcarchive \
          archive
        
        cd ..
        xcodebuild \
          -exportArchive \
          -archivePath build/Madeira.xcarchive \
          -exportOptionsPlist ExportOptions.plist \
          -exportPath build/ipa

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: Madeira.ipa
        path: build/ipa/Madeira.ipa
        retention-days: 7

    - name: Upload Archive artifact
      uses: actions/upload-artifact@v4
      with:
        name: Madeira.xcarchive
        path: build/Madeira.xcarchive
        retention-days: 7

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/ipa/Madeira.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
